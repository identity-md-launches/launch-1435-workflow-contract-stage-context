[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.26"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false
